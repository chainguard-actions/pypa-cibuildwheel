name: Test basic usage (empty build selection)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CIBW_BUILD: "cp312-win_amd64"
      CIBW_ALLOW_EMPTY: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          package-dir: tests/fixtures/pkg
          output-dir: wheelhouse-basic
      - name: Assert cibuildwheel installed and exposed
        run: |
          ls -la "$RUNNER_TEMP/cibw/bin.clean" || true
          if [ ! -e "$RUNNER_TEMP/cibw/bin.clean/cibuildwheel" ]; then
            echo "FAIL: cibuildwheel not exposed in clean bin path"
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/cibw/bin.clean/uv" ]; then
            echo "FAIL: uv should not be exposed without uv extra"
            exit 1
          fi
          "$RUNNER_TEMP/cibw/bin.clean/cibuildwheel" --help
          echo "PASS"
