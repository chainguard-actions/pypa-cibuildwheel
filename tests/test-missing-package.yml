name: Test error when package dir has no project files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CIBW_SKIP: "*"
      CIBW_ALLOW_EMPTY: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          package-dir: tests/fixtures/empty-dir
          output-dir: missing-wheelhouse
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a package dir without setup.py/pyproject.toml"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/missing-wheelhouse" ]; then
            echo "FAIL: output dir should not be created when configuration is invalid"
            exit 1
          fi
          echo "PASS"
