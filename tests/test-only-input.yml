name: Test cibuildwheel only input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with the 'only' input set.
      # The build step will fail without a real package, but the setup phase should succeed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          package-dir: .
          only: cp311-manylinux_x86_64

      - name: Assert cibuildwheel venv was created (setup phase succeeded)
        run: |
          VENV_PATH="$RUNNER_TEMP/cibw"
          echo "Checking venv at: $VENV_PATH"
          if [ ! -d "$VENV_PATH" ]; then
            echo "FAIL: cibuildwheel venv directory not found at '$VENV_PATH'"
            exit 1
          fi
          echo "PASS: venv directory exists"

      - name: Assert cibuildwheel binary is present in venv
        run: |
          VENV_PATH="$RUNNER_TEMP/cibw"
          CIBW_BIN=$(find "$VENV_PATH" -name "cibuildwheel" -type f 2>/dev/null | head -1)
          if [ -z "$CIBW_BIN" ]; then
            echo "FAIL: cibuildwheel binary not found in venv"
            exit 1
          fi
          echo "PASS: cibuildwheel found at '$CIBW_BIN'"
          VERSION=$("$CIBW_BIN" --version 2>&1 || true)
          echo "Version: $VERSION"
