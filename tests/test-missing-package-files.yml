name: Test error when package dir has no project files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CIBW_BUILD: cp312-macosx_x86_64
      CIBW_ALLOW_EMPTY: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          package-dir: tests/fixtures/empty-pkg
          output-dir: missing-wheelhouse
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for package dir without project files"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/missing-wheelhouse" ]; then
            echo "FAIL: output dir should not be created on config error"
            exit 1
          fi
          echo "PASS"
