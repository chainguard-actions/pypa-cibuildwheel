name: Test cibuildwheel with --only flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cibuildwheel with --only flag
        id: action
        uses: .
        continue-on-error: true
        with:
          package-dir: pristine/pypa--cibuildwheel/v4.0.0/tests/fixtures/minimal-package
          output-dir: /tmp/wheelhouse-only
          only: cp311-manylinux_x86_64
        env:
          CIBW_ALLOW_EMPTY: "1"

      - name: Verify cibuildwheel venv was created
        run: |
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "Checking cibuildwheel venv at $RUNNER_TEMP/cibw..."
          if [ ! -d "$RUNNER_TEMP/cibw" ]; then
            echo "FAIL: cibuildwheel venv not found at $RUNNER_TEMP/cibw"
            echo "Contents of RUNNER_TEMP:"
            ls -la "$RUNNER_TEMP/" 2>/dev/null || echo "(empty or not found)"
            exit 1
          fi
          echo "PASS: cibuildwheel venv created at $RUNNER_TEMP/cibw"

      - name: Verify cibuildwheel binary is in clean bin path
        run: |
          echo "Searching for clean bin directory..."
          clean_bin=$(find "$RUNNER_TEMP/cibw" -name "bin.clean" -type d 2>/dev/null | head -1)
          echo "Clean bin path: $clean_bin"
          if [ -z "$clean_bin" ]; then
            echo "FAIL: clean bin directory not found - action setup did not complete"
            exit 1
          fi
          echo "Contents of clean bin:"
          ls -la "$clean_bin/"
          if ls "$clean_bin/cibuildwheel"* 2>/dev/null | grep -q cibuildwheel; then
            echo "PASS: cibuildwheel binary found in clean bin path"
          else
            echo "FAIL: cibuildwheel binary not found in clean bin path"
            exit 1
          fi
          echo "PASS: --only flag test completed successfully"
