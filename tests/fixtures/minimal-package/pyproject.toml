[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minimal-test-package"
version = "0.1.0"
description = "A minimal test package for cibuildwheel testing"
requires-python = ">=3.8"

[tool.hatch.build.targets.wheel]
packages = ["src/minimal_test_package"]

[tool.cibuildwheel]
# Only build for the current Python version to speed up tests
build = ["cp3*-*"]
# Skip musllinux and other slow builds
skip = ["*-musllinux*", "*-manylinux_i686", "*-win32"]
