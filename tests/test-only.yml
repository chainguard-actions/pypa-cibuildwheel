name: Test only input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean output dir
        run: rm -rf "$GITHUB_WORKSPACE/only-out"
      - id: action
        uses: .
        with:
          package-dir: tests/fixtures/pkg
          output-dir: only-out
          only: cp312-manylinux_x86_64
        env:
          # requires-python still filters the --only identifier out, so
          # nothing is built and no container engine is needed.
          CIBW_PROJECT_REQUIRES_PYTHON: ">=9.0"
          CIBW_ALLOW_EMPTY: "1"
      - name: Assert step succeeded and output dir exists
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ ! -d "$GITHUB_WORKSPACE/only-out" ]; then
            echo "FAIL: output dir not created"
            exit 1
          fi
          echo "PASS"
