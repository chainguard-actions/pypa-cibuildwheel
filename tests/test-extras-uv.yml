name: Test extras uv
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal Python package
      - name: Create minimal Python package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pkg"
          cat > "$GITHUB_WORKSPACE/test-pkg/pyproject.toml" << 'EOF'
          [build-system]
          requires = ["setuptools"]
          build-backend = "setuptools.backends.legacy:build"

          [project]
          name = "hello"
          version = "0.1.0"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          package-dir: test-pkg
          output-dir: wheelhouse
          extras: uv

      - name: Assert action ran with uv extra
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action installs cibuildwheel[uv] and exposes uv binary.
          # It either succeeds (wheel built) or fails gracefully (no Docker-in-Docker).
          # Either way, the action must have run (not skipped).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
