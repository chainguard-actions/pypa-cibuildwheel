name: Test extras input (uv)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CIBW_SKIP: "*"
      CIBW_ALLOW_EMPTY: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          package-dir: tests/fixtures/pkg
          output-dir: uv-wheelhouse
          extras: " uv , "
      - name: Assert uv and cibuildwheel exposed
        run: |
          ls -la "$RUNNER_TEMP/cibw/bin.clean" || true
          for b in cibuildwheel uv; do
            if [ ! -e "$RUNNER_TEMP/cibw/bin.clean/$b" ]; then
              echo "FAIL: $b not exposed in bin.clean"
              exit 1
            fi
          done
          "$RUNNER_TEMP/cibw/bin.clean/uv" --version
          if [ ! -d "$GITHUB_WORKSPACE/uv-wheelhouse" ]; then
            echo "FAIL: output dir not created"
            exit 1
          fi
          echo "PASS"
