name: Test extras with uv
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare package directory in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pkg-uv"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/minimal-package/." "$GITHUB_WORKSPACE/test-pkg-uv/"
          mkdir -p "$GITHUB_WORKSPACE/test-wh-uv"

      - id: action
        uses: .
        with:
          package-dir: ./test-pkg-uv
          output-dir: ./test-wh-uv
          extras: uv
          only: cp311-manylinux_x86_64
        continue-on-error: true

      - name: Assert cibuildwheel and uv were installed in venv
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — verifying cibuildwheel and uv in venv"
            if [ ! -d "$RUNNER_TEMP/cibw" ]; then
              echo "FAIL: cibuildwheel venv directory not found at $RUNNER_TEMP/cibw"
              exit 1
            fi
            CIBW_BIN=$(find "$RUNNER_TEMP/cibw" -name "cibuildwheel" 2>/dev/null | head -1)
            if [ -z "$CIBW_BIN" ]; then
              echo "FAIL: cibuildwheel binary not found in venv"
              exit 1
            fi
            echo "PASS: cibuildwheel found at $CIBW_BIN"
            UV_BIN=$(find "$RUNNER_TEMP/cibw" -name "uv" 2>/dev/null | head -1)
            if [ -z "$UV_BIN" ]; then
              echo "FAIL: uv binary not found in venv (extras=uv should have installed it)"
              exit 1
            fi
            echo "PASS: uv found at $UV_BIN"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker or setup-python not available in act)"
            # Even on failure, if the cibw step ran, uv should be in the venv
            if [ -d "$RUNNER_TEMP/cibw" ]; then
              UV_BIN=$(find "$RUNNER_TEMP/cibw" -name "uv" 2>/dev/null | head -1)
              if [ -n "$UV_BIN" ]; then
                echo "INFO: uv was installed before failure: $UV_BIN"
              fi
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
