name: Test custom output-dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare output directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-custom-wheels"
          mkdir -p "$GITHUB_WORKSPACE/wheelhouse"

      - id: action
        uses: .
        continue-on-error: true
        with:
          package-dir: ${{ github.workspace }}/tests/fixtures/minimal-package
          output-dir: ${{ github.workspace }}/my-custom-wheels
          only: cp312-manylinux_x86_64
        env:
          CIBW_BUILD_VERBOSITY: "1"

      - name: Assert action ran (wheel produced in custom dir or failed gracefully without Docker)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Listing my-custom-wheels:"
            ls -la "$GITHUB_WORKSPACE/my-custom-wheels" || true
            count=$(find "$GITHUB_WORKSPACE/my-custom-wheels" -name "*.whl" | wc -l)
            echo "Wheel count: $count"
            if [ "$count" -lt 1 ]; then
              echo "FAIL: action succeeded but no .whl file found in my-custom-wheels"
              exit 1
            fi
            echo "PASS: found $count wheel(s) in custom output dir"

            # Also verify wheels were NOT placed in the default wheelhouse
            default_count=$(find "$GITHUB_WORKSPACE/wheelhouse" -name "*.whl" 2>/dev/null | wc -l)
            if [ "$default_count" -gt 0 ]; then
              echo "FAIL: wheels were also placed in default 'wheelhouse' instead of only custom dir"
              exit 1
            fi
            echo "PASS: default wheelhouse not used"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely no Docker available for manylinux build under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
