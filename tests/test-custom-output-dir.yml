name: Test custom output-dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal Python package
      - name: Create minimal Python package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pkg"
          cat > "$GITHUB_WORKSPACE/test-pkg/pyproject.toml" << 'EOF'
          [build-system]
          requires = ["setuptools"]
          build-backend = "setuptools.backends.legacy:build"

          [project]
          name = "hello"
          version = "0.1.0"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          package-dir: test-pkg
          output-dir: custom-wheels

      - name: Assert action ran with custom output-dir
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action either succeeds (wheel built into custom-wheels/) or fails
          # gracefully (Docker-in-Docker not available under act).
          # Either way, the action must have run (not skipped).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Check output directory was used (if build succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # If the build succeeded, wheels should be in custom-wheels/
            if ls custom-wheels/*.whl 2>/dev/null | head -1 | grep -q '.whl'; then
              echo "PASS: wheel found in custom-wheels/"
            else
              echo "INFO: no wheels found in custom-wheels/ (pure Python package)"
            fi
          else
            echo "PASS: build did not succeed (expected under act without Docker-in-Docker)"
          fi
