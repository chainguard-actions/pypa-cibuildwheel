name: Test config-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare package directory in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pkg-config"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/minimal-package/." "$GITHUB_WORKSPACE/test-pkg-config/"
          mkdir -p "$GITHUB_WORKSPACE/test-wh-config"

      - id: action
        uses: .
        with:
          package-dir: ./test-pkg-config
          output-dir: ./test-wh-config
          config-file: ./test-pkg-config/cibuildwheel-config.toml
          only: cp311-manylinux_x86_64
        continue-on-error: true

      - name: Assert action ran with config-file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config file"
            if [ ! -d "$RUNNER_TEMP/cibw" ]; then
              echo "FAIL: cibuildwheel venv directory not found at $RUNNER_TEMP/cibw"
              exit 1
            fi
            CIBW_BIN=$(find "$RUNNER_TEMP/cibw" -name "cibuildwheel" 2>/dev/null | head -1)
            if [ -z "$CIBW_BIN" ]; then
              echo "FAIL: cibuildwheel binary not found in venv"
              exit 1
            fi
            echo "PASS: cibuildwheel found at $CIBW_BIN"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker or setup-python not available in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
