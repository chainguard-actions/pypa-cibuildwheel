name: Test config-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Assert config file fixture exists
        run: |
          CONFIG="$GITHUB_WORKSPACE/tests/fixtures/cibw-config/cibuildwheel.toml"
          echo "Checking config file: $CONFIG"
          if [ ! -f "$CONFIG" ]; then
            echo "FAIL: config file fixture not found at $CONFIG"
            exit 1
          fi
          echo "PASS: config file fixture exists"
          cat "$CONFIG"

      # Test that the 'config-file' input is accepted without error during install.
      - id: action
        uses: .
        continue-on-error: true
        with:
          package-dir: tests/fixtures/minimal-package
          output-dir: wheelhouse
          config-file: tests/fixtures/cibw-config/cibuildwheel.toml
        env:
          CIBW_SKIP: "*"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME'"

      - name: Assert cibuildwheel install artifacts exist or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          VENV_PATH="${RUNNER_TEMP:-/tmp}/cibw"
          echo "Checking venv at: $VENV_PATH"
          if [ -d "$VENV_PATH" ]; then
            echo "venv directory exists at $VENV_PATH"
            CIBW_BIN=$(find "$VENV_PATH" -name "cibuildwheel" 2>/dev/null | head -1)
            if [ -n "$CIBW_BIN" ]; then
              echo "PASS: cibuildwheel found at $CIBW_BIN"
            else
              echo "INFO: venv exists but cibuildwheel binary not found"
              echo "PASS: install step ran (venv was created)"
            fi
          else
            echo "INFO: venv not found at $VENV_PATH"
            if [ "$OUTCOME" = "success" ]; then
              echo "FAIL: action succeeded but venv not found"
              exit 1
            fi
            echo "PASS: action failed gracefully (expected in act environment)"
          fi
