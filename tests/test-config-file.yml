name: Test config-file input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cibuildwheel action with custom config-file (may fail at build step in act)
        id: action
        uses: .
        with:
          package-dir: tests/fixtures/minimal-package
          output-dir: /tmp/config-test-wheelhouse
          config-file: tests/fixtures/cibw-config.toml
        continue-on-error: true

      - name: Assert cibuildwheel venv was created (installation phase succeeded)
        run: |
          echo "Checking for cibuildwheel venv at $RUNNER_TEMP/cibw"
          if [ ! -d "$RUNNER_TEMP/cibw" ]; then
            echo "FAIL: cibuildwheel venv directory not found - installation phase failed"
            exit 1
          fi
          echo "PASS: venv directory exists, installation phase succeeded"

      - name: Assert cibuildwheel binary is present and functional
        run: |
          CIBW_BIN=$(find "$RUNNER_TEMP/cibw" -name "cibuildwheel" 2>/dev/null | head -1)
          echo "cibuildwheel binary: $CIBW_BIN"
          if [ -z "$CIBW_BIN" ]; then
            echo "FAIL: cibuildwheel binary not found in venv"
            exit 1
          fi
          VERSION=$("$CIBW_BIN" --version 2>&1 || true)
          echo "Version: $VERSION"
          if echo "$VERSION" | grep -q "cibuildwheel"; then
            echo "PASS: cibuildwheel installed and functional"
          else
            echo "FAIL: cibuildwheel not functional: $VERSION"
            exit 1
          fi

      - name: Assert config file exists and is readable
        run: |
          CONFIG_FILE="tests/fixtures/cibw-config.toml"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: config file not found at $CONFIG_FILE"
            exit 1
          fi
          echo "Config file contents:"
          cat "$CONFIG_FILE"
          echo "PASS: config file exists and is readable"
