name: Test config-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare output directory
        run: mkdir -p "$GITHUB_WORKSPACE/wheelhouse-config"

      - id: action
        uses: .
        continue-on-error: true
        with:
          package-dir: ${{ github.workspace }}/tests/fixtures/minimal-package
          output-dir: ${{ github.workspace }}/wheelhouse-config
          config-file: ${{ github.workspace }}/tests/fixtures/minimal-package/cibw-config.toml
        env:
          CIBW_BUILD_VERBOSITY: "1"

      - name: Assert action ran (wheel produced or failed gracefully without Docker)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Listing wheelhouse-config:"
            ls -la "$GITHUB_WORKSPACE/wheelhouse-config" || true
            count=$(find "$GITHUB_WORKSPACE/wheelhouse-config" -name "*.whl" | wc -l)
            echo "Wheel count: $count"
            if [ "$count" -lt 1 ]; then
              echo "FAIL: action succeeded but no .whl file found in wheelhouse-config"
              exit 1
            fi
            echo "PASS: found $count wheel(s) using config-file input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely no Docker available for manylinux build under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
