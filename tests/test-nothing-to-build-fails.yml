name: Test failure when no wheels are selected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          package-dir: tests/fixtures/pkg
          output-dir: nothing-out
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ">=9.0"
          CIBW_ALLOW_EMPTY: "0"
      - name: Assert action failed (NothingToDoError)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no build identifiers are selected"
            exit 1
          fi
          if [ ! -x "$RUNNER_TEMP/cibw/bin/cibuildwheel" ]; then
            echo "FAIL: cibuildwheel should have been installed before failing"
            exit 1
          fi
          echo "PASS"
