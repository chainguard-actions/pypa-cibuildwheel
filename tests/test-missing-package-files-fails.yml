name: Test failure when package-dir has no project files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean output dir
        run: rm -rf "$GITHUB_WORKSPACE/nopkg-out"
      - id: action
        uses: .
        continue-on-error: true
        with:
          package-dir: tests/fixtures/nopkg
          output-dir: nopkg-out
        env:
          CIBW_ALLOW_EMPTY: "1"
      - name: Assert action failed and produced no output dir
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for package dir without setup.py/pyproject.toml"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/nopkg-out" ]; then
            echo "FAIL: output dir should not be created on configuration error"
            exit 1
          fi
          echo "PASS"
