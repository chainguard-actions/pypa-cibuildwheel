name: Test python-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Find system Python
        id: find-python
        run: |
          PYTHON_PATH=$(which python3)
          echo "python-path=$PYTHON_PATH" >> "$GITHUB_OUTPUT"
          echo "Found Python at: $PYTHON_PATH"
          "$PYTHON_PATH" --version

      - name: Prepare package directory in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pkg-pypath"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/minimal-package/." "$GITHUB_WORKSPACE/test-pkg-pypath/"
          mkdir -p "$GITHUB_WORKSPACE/test-wh-pypath"

      - id: action
        uses: .
        with:
          package-dir: ./test-pkg-pypath
          output-dir: ./test-wh-pypath
          python-path: ${{ steps.find-python.outputs.python-path }}
          only: cp311-manylinux_x86_64
        continue-on-error: true

      - name: Assert cibuildwheel was installed using custom python-path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # When python-path is provided, setup-python is skipped.
          # The cibw install step should succeed; only the Docker build step may fail.
          if [ "$OUTCOME" = "success" ]; then
            # Full success: venv must exist with cibuildwheel
            if [ ! -d "$RUNNER_TEMP/cibw" ]; then
              echo "FAIL: cibuildwheel venv directory not found at $RUNNER_TEMP/cibw"
              exit 1
            fi
            CIBW_BIN=$(find "$RUNNER_TEMP/cibw" -name "cibuildwheel" 2>/dev/null | head -1)
            if [ -z "$CIBW_BIN" ]; then
              echo "FAIL: cibuildwheel binary not found in venv"
              exit 1
            fi
            echo "PASS: cibuildwheel found at $CIBW_BIN"
            echo "PASS: action succeeded with custom python-path"
          elif [ "$OUTCOME" = "failure" ]; then
            # Failure is expected when Docker is not available for the build step
            echo "PASS: action failed gracefully (Docker not available in act environment)"
            # Verify the venv was still created (install step ran before build step failed)
            if [ -d "$RUNNER_TEMP/cibw" ]; then
              CIBW_BIN=$(find "$RUNNER_TEMP/cibw" -name "cibuildwheel" 2>/dev/null | head -1)
              if [ -n "$CIBW_BIN" ]; then
                echo "INFO: cibuildwheel was installed before build failure: $CIBW_BIN"
              fi
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
