name: Test python-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CIBW_BUILD: "cp312-win_amd64"
      CIBW_ALLOW_EMPTY: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false
      - id: action
        uses: .
        with:
          package-dir: tests/fixtures/pkg
          python-path: ${{ steps.py.outputs.python-path }}
      - name: Assert venv created with supplied interpreter
        run: |
          cat "$RUNNER_TEMP/cibw/pyvenv.cfg"
          if ! grep -qE '^version.*= *3\.12' "$RUNNER_TEMP/cibw/pyvenv.cfg"; then
            echo "FAIL: venv not created with Python 3.12"
            exit 1
          fi
          if [ ! -e "$RUNNER_TEMP/cibw/bin.clean/cibuildwheel" ]; then
            echo "FAIL: cibuildwheel not exposed"
            exit 1
          fi
          echo "PASS"
