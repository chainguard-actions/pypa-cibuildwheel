name: Test cibuildwheel default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cibuildwheel with default output-dir and config-file inputs
        id: cibw_action
        uses: .
        continue-on-error: true
        with:
          package-dir: ${{ github.workspace }}/pristine/pypa--cibuildwheel/v4.1.0/tests/fixtures/minimal-package
          # output-dir defaults to "wheelhouse"
          # config-file defaults to {package}/pyproject.toml (which has skip=["*"])
        env:
          CIBW_SKIP: "*"

      - name: Assert cibuildwheel venv was created
        run: |
          CIBW_VENV="$RUNNER_TEMP/cibw"
          echo "Checking venv at: $CIBW_VENV"
          if [ ! -d "$CIBW_VENV" ]; then
            echo "FAIL: cibuildwheel venv not found at $CIBW_VENV"
            exit 1
          fi
          echo "PASS: cibuildwheel venv exists at $CIBW_VENV"

      - name: Assert cibuildwheel binary is accessible in clean bin path
        run: |
          CIBW_VENV="$RUNNER_TEMP/cibw"
          CLEAN_BIN="$CIBW_VENV/bin.clean"
          echo "Checking cibuildwheel in: $CLEAN_BIN"
          if [ ! -f "$CLEAN_BIN/cibuildwheel" ] && [ ! -L "$CLEAN_BIN/cibuildwheel" ]; then
            echo "FAIL: cibuildwheel binary not found in $CLEAN_BIN"
            ls -la "$CLEAN_BIN" 2>/dev/null || echo "(directory does not exist)"
            exit 1
          fi
          echo "PASS: cibuildwheel binary found in clean bin path"

      - name: Assert uv is NOT in the clean bin path (default extras)
        run: |
          CIBW_VENV="$RUNNER_TEMP/cibw"
          CLEAN_BIN="$CIBW_VENV/bin.clean"
          echo "Checking that uv is NOT in: $CLEAN_BIN (no extras specified)"
          if [ -f "$CLEAN_BIN/uv" ] || [ -L "$CLEAN_BIN/uv" ]; then
            echo "FAIL: uv found in clean bin path but no extras were specified"
            exit 1
          fi
          echo "PASS: uv correctly absent from clean bin path when no extras specified"
