name: Test invalid package dir fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CIBW_BUILD: "cp27-nonexistent_*"
      CIBW_ALLOW_EMPTY: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty package dir
        run: mkdir -p empty-pkg-dir
      - id: action
        uses: .
        continue-on-error: true
        with:
          package-dir: empty-pkg-dir
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for package dir without project files"
            exit 1
          fi
          if [ ! -e "$RUNNER_TEMP/cibw/bin.clean/cibuildwheel" ]; then
            echo "FAIL: install step should have succeeded before the build failed"
            exit 1
          fi
          echo "PASS"
