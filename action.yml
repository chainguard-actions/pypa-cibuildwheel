name: cibuildwheel
description: 'Installs and runs cibuildwheel on the current runner'
inputs:
  package-dir:
    description: 'Input directory, defaults to "."'
    required: false
    default: .
  output-dir:
    description: 'Folder to place the outputs in, defaults to "wheelhouse"'
    required: false
    default: wheelhouse
  config-file:
    description: 'File containing the config, defaults to {package}/pyproject.toml'
    required: false
    default: ''
  only:
    description: 'Build a specific wheel only. No need for arch/platform if this is set'
    required: false
    default: ''
branding:
  icon: package
  color: yellow

runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    # Set up the version of Python that supports pyodide
    - uses: chainguard-actions/actions-setup-python@ace3254bb5011efbd0650a7120a0441ebd1f9400 # v5
      id: python
      with:
        python-version: "3.12"
        update-environment: false

    - id: cibw
      env:
        CIBW_PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        CIBW_ACTION_PATH: ${{ github.action_path }}
        CIBW_RUNNER_TEMP: ${{ runner.temp }}
      run: |
        # Install cibuildwheel
        "$CIBW_PYTHON_PATH" -u << "EOF"
        import os
        import shutil
        import sys
        import venv

        from pathlib import Path
        from subprocess import run


        class EnvBuilder(venv.EnvBuilder):
            def __init__(self):
                super().__init__()

            def setup_scripts(self, context):
                pass

            def post_setup(self, context):
                super().post_setup(context)
                self.bin_path = Path(context.env_exe).parent
                run([sys.executable, "-m", "pip", "--python", context.env_exe, "install", os.environ["CIBW_ACTION_PATH"]], check=True)


        print("::group::Install cibuildwheel")
        venv_path = Path(os.environ["CIBW_RUNNER_TEMP"]) / "cibw"
        if venv_path.exists():
            shutil.rmtree(venv_path)
        builder = EnvBuilder()
        builder.create(venv_path)
        cibw_path = [path for path in builder.bin_path.glob("cibuildwheel*") if path.stem == "cibuildwheel"][0]
        with open(os.environ["GITHUB_OUTPUT"], "at") as f:
            f.write(f"cibw-path={cibw_path}\n")
        print("::endgroup::")
        EOF
      shell: bash

    # Redirecting stderr to stdout to fix interleaving issue in Actions.
    - env:
        CIBW_EXE_PATH: ${{ steps.cibw.outputs.cibw-path }}
        CIBW_INPUT_PACKAGE_DIR: ${{ inputs.package-dir }}
        CIBW_INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        CIBW_INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        CIBW_INPUT_ONLY: ${{ inputs.only }}
      run: |
        cibw_args=("$CIBW_INPUT_PACKAGE_DIR")
        if [ -n "$CIBW_INPUT_OUTPUT_DIR" ]; then cibw_args+=(--output-dir "$CIBW_INPUT_OUTPUT_DIR"); fi
        if [ -n "$CIBW_INPUT_CONFIG_FILE" ]; then cibw_args+=(--config-file "$CIBW_INPUT_CONFIG_FILE"); fi
        if [ -n "$CIBW_INPUT_ONLY" ]; then cibw_args+=(--only "$CIBW_INPUT_ONLY"); fi
        "$CIBW_EXE_PATH" "${cibw_args[@]}" 2>&1
      shell: bash
      if: runner.os != 'Windows'

    # Windows needs powershell to interact nicely with Meson
    - env:
        CIBW_EXE_PATH: ${{ steps.cibw.outputs.cibw-path }}
        CIBW_INPUT_PACKAGE_DIR: ${{ inputs.package-dir }}
        CIBW_INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        CIBW_INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        CIBW_INPUT_ONLY: ${{ inputs.only }}
      run: |
        $cibwArgs = @("$env:CIBW_INPUT_PACKAGE_DIR")
        if ($env:CIBW_INPUT_OUTPUT_DIR) { $cibwArgs += @('--output-dir', "$env:CIBW_INPUT_OUTPUT_DIR") }
        if ($env:CIBW_INPUT_CONFIG_FILE) { $cibwArgs += @('--config-file', "$env:CIBW_INPUT_CONFIG_FILE") }
        if ($env:CIBW_INPUT_ONLY) { $cibwArgs += @('--only', "$env:CIBW_INPUT_ONLY") }
        & "$env:CIBW_EXE_PATH" @cibwArgs
      shell: pwsh
      if: runner.os == 'Windows'
