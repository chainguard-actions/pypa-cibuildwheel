name: cibuildwheel
description: 'Installs and runs cibuildwheel on the current runner'
inputs:
  package-dir:
    description: 'Input directory, defaults to "."'
    required: false
    default: .
  output-dir:
    description: 'Folder to place the outputs in, defaults to "wheelhouse"'
    required: false
    default: wheelhouse
  config-file:
    description: 'File containing the config, defaults to {package}/pyproject.toml'
    required: false
    default: ''
  only:
    description: 'Build a specific wheel only. No need for arch/platform if this is set'
    required: false
    default: ''
branding:
  icon: package
  color: yellow

runs:
  using: composite
  steps:
    # Set up the version of Python that supports pyodide
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      id: python
      with:
        python-version: "3.12"
        update-environment: false

    - id: cibw
      run: |
        # Install cibuildwheel
        "${{ steps.python.outputs.python-path }}" -u << "EOF"
        import os
        import shutil
        import sys
        import venv

        from pathlib import Path
        from subprocess import run


        class EnvBuilder(venv.EnvBuilder):
            def __init__(self):
                super().__init__()

            def setup_scripts(self, context):
                pass

            def post_setup(self, context):
                super().post_setup(context)
                self.bin_path = Path(context.env_exe).parent
                run([sys.executable, "-m", "pip", "--python", context.env_exe, "install", r"${{ github.action_path }}"], check=True)


        print("::group::Install cibuildwheel")
        venv_path = Path(r"${{ runner.temp }}") / "cibw"
        if venv_path.exists():
            shutil.rmtree(venv_path)
        builder = EnvBuilder()
        builder.create(venv_path)
        cibw_path = [path for path in builder.bin_path.glob("cibuildwheel*") if path.stem == "cibuildwheel"][0]
        with open(os.environ["GITHUB_OUTPUT"], "at") as f:
            f.write(f"cibw-path={cibw_path}\n")
        print("::endgroup::")
        EOF
      shell: bash

    # Redirecting stderr to stdout to fix interleaving issue in Actions.
    - env:
        CIBW_PATH: ${{ steps.cibw.outputs.cibw-path }}
        INPUT_PACKAGE_DIR: ${{ inputs.package-dir }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_ONLY: ${{ inputs.only }}
      run: |
        args=("$CIBW_PATH" "$INPUT_PACKAGE_DIR")
        if [ -n "$INPUT_OUTPUT_DIR" ]; then
          args+=(--output-dir "$INPUT_OUTPUT_DIR")
        fi
        if [ -n "$INPUT_CONFIG_FILE" ]; then
          args+=(--config-file "$INPUT_CONFIG_FILE")
        fi
        if [ -n "$INPUT_ONLY" ]; then
          args+=(--only "$INPUT_ONLY")
        fi
        "${args[@]}" 2>&1
      shell: bash
      if: runner.os != 'Windows'

    # Windows needs powershell to interact nicely with Meson
    - env:
        CIBW_PATH: ${{ steps.cibw.outputs.cibw-path }}
        INPUT_PACKAGE_DIR: ${{ inputs.package-dir }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_ONLY: ${{ inputs.only }}
      run: |
        $args = @($env:CIBW_PATH, $env:INPUT_PACKAGE_DIR)
        if ($env:INPUT_OUTPUT_DIR -ne '') {
          $args += '--output-dir'
          $args += $env:INPUT_OUTPUT_DIR
        }
        if ($env:INPUT_CONFIG_FILE -ne '') {
          $args += '--config-file'
          $args += $env:INPUT_CONFIG_FILE
        }
        if ($env:INPUT_ONLY -ne '') {
          $args += '--only'
          $args += $env:INPUT_ONLY
        }
        & $args[0] $args[1..($args.Length-1)]
      shell: pwsh
      if: runner.os == 'Windows'
