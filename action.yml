name: cibuildwheel
description: 'Installs and runs cibuildwheel on the current runner'
inputs:
  package-dir:
    description: 'Input directory, defaults to "."'
    required: false
    default: .
  output-dir:
    description: 'Folder to place the outputs in, defaults to "wheelhouse"'
    required: false
    default: wheelhouse
  config-file:
    description: 'File containing the config, defaults to {package}/pyproject.toml'
    required: false
    default: ''
  only:
    description: 'Build a specific wheel only. No need for arch/platform if this is set'
    required: false
    default: ''
branding:
  icon: package
  color: yellow
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    # Set up the version of Python that supports pyodide
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      id: python
      with:
        python-version: "3.12"
        update-environment: false
    - id: cibw
      env:
        PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        ACTION_PATH: ${{ github.action_path }}
        RUNNER_TEMP_PATH: ${{ runner.temp }}
      run: |
        # Install cibuildwheel
        "$PYTHON_PATH" -u << "EOF"
        import os
        import shutil
        import sys
        import venv

        from pathlib import Path
        from subprocess import run


        class EnvBuilder(venv.EnvBuilder):
            def __init__(self):
                super().__init__()

            def setup_scripts(self, context):
                pass

            def post_setup(self, context):
                super().post_setup(context)
                self.bin_path = Path(context.env_exe).parent
                run([sys.executable, "-m", "pip", "--python", context.env_exe, "install", os.environ["ACTION_PATH"]], check=True)


        print("::group::Install cibuildwheel")
        venv_path = Path(os.environ["RUNNER_TEMP_PATH"]) / "cibw"
        if venv_path.exists():
            shutil.rmtree(venv_path)
        builder = EnvBuilder()
        builder.create(venv_path)
        cibw_path = [path for path in builder.bin_path.glob("cibuildwheel*") if path.stem == "cibuildwheel"][0]
        with open(os.environ["GITHUB_OUTPUT"], "at") as f:
            f.write(f"cibw-path={cibw_path}\n")
        print("::endgroup::")
        EOF
      shell: bash
    # Redirecting stderr to stdout to fix interleaving issue in Actions.
    - env:
        CIBW_PATH: ${{ steps.cibw.outputs.cibw-path }}
        INPUT_PACKAGE_DIR: ${{ inputs.package-dir }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_ONLY: ${{ inputs.only }}
      run: |
        args=()
        args+=("$INPUT_PACKAGE_DIR")
        [ -n "$INPUT_OUTPUT_DIR" ] && args+=(--output-dir "$INPUT_OUTPUT_DIR")
        [ -n "$INPUT_CONFIG_FILE" ] && args+=(--config-file "$INPUT_CONFIG_FILE")
        [ -n "$INPUT_ONLY" ] && args+=(--only "$INPUT_ONLY")
        "$CIBW_PATH" "${args[@]}" 2>&1
      shell: bash
      if: runner.os != 'Windows'
    # Windows needs powershell to interact nicely with Meson
    - env:
        CIBW_PATH: ${{ steps.cibw.outputs.cibw-path }}
        INPUT_PACKAGE_DIR: ${{ inputs.package-dir }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_ONLY: ${{ inputs.only }}
      run: |
        $args = @($env:INPUT_PACKAGE_DIR)
        if ($env:INPUT_OUTPUT_DIR) { $args += '--output-dir', $env:INPUT_OUTPUT_DIR }
        if ($env:INPUT_CONFIG_FILE) { $args += '--config-file', $env:INPUT_CONFIG_FILE }
        if ($env:INPUT_ONLY) { $args += '--only', $env:INPUT_ONLY }
        & $env:CIBW_PATH @args
      shell: pwsh
      if: runner.os == 'Windows'
